[project]
name = "huckleberry-homepod"
version = "0.1.0"
description = "Read-only Huckleberry reminders announced on a HomePod"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.10",
    "huckleberry-api>=0.4.3",
    "pyatv>=0.16",
    "python-dotenv>=1.0",
]

[project.scripts]
hb-homepod = "huckleberry_homepod.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/huckleberry_homepod"]

[tool.pytest.ini_options]
pythonpath = ["src"]
